spring:
  application:
    name: tdop-api
  datasource:
    # Credentials come from the environment only (D-017): never hard-code them here.
    # Local values are exported from .env by scripts/dev.ps1 and by the Makefile.
    url: ${TDOP_DB_URL:jdbc:postgresql://127.0.0.1:5432/${POSTGRES_DB:tdop_dev}}
    username: ${TDOP_DB_USERNAME:${POSTGRES_USER:tdop_dev}}
    password: ${TDOP_DB_PASSWORD:${POSTGRES_PASSWORD:}}
    hikari:
      maximum-pool-size: ${TDOP_DB_POOL_SIZE:5}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}
