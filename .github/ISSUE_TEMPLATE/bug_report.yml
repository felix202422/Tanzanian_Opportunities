name: Bug report
description: Report a reproducible defect in an implemented TDOP capability.
title: "[bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Do not include passwords, tokens, private verification documents, or real user data.
        For security vulnerabilities, follow SECURITY.md instead of opening a public issue.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: Numbered steps using non-sensitive test data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Commit or release, browser/OS, and relevant configuration (redact secrets).
    validations:
      required: true
